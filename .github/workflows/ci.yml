name: ci
on: [push, pull_request]

concurrency:
  group: planner-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest
      - run: pip install pip-audit && pip-audit -r requirements.txt
      - run: "! git grep -nIE '(AIza[0-9A-Za-z_-]{35}|sk-[A-Za-z0-9]{20,})'"
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: tests/ui
      - run: npm test
        working-directory: tests/ui

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, ui]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check deployment secrets
        run: |
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
      - name: Install the Vercel CLI
        run: npm install --global vercel@latest
      - name: Build the production bundle
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy to production
        id: deploy
        run: |
          url="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Smoke-test production
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent --show-error \
              "$DEPLOYMENT_URL/api/health" | grep -q '"status":"ok"'; then
              curl --fail --silent --show-error --head "$DEPLOYMENT_URL/"
              exit 0
            fi
            sleep 3
          done
          echo "Production health check failed: $DEPLOYMENT_URL" >&2
          exit 1
